<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Padhaan</title>
</head>
<body style="font-family: Inter, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f8fafc;">
    <div style="background:white; padding:30px; border-radius:16px; width:100%; max-width:400px; box-shadow:0 10px 30px rgba(0,0,0,0.08);">
        <h2 style="margin-bottom:16px;">Set New Password</h2>
        <input type="password" id="newPassword" placeholder="New Password" style="width:100%; padding:12px; border:1px solid #ccc; border-radius:10px; margin-bottom:14px;">
        <button onclick="resetPassword()" style="width:100%; padding:12px; border:none; border-radius:10px; background:linear-gradient(135deg,#f59e0b,#8b5cf6); color:white; font-weight:700;">
            Update Password
        </button>
    </div>

    <script>
    async function resetPassword() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");
        const newPassword = document.getElementById("newPassword").value;

        const res = await fetch('/admin/reset-password', {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ token, newPassword })
        });

        const data = await res.json();
        alert(data.message || data.error);
    }
    </script>
</body>
</html>
