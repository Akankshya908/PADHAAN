<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padhaan - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --border: #e7ecf3;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #6d5dfc;
            --primary-dark: #5546e8;
            --warning: #ff9f43;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 14px 32px rgba(15, 23, 42, 0.08);
            --shadow-soft: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        body {
            background: linear-gradient(180deg, #f7f9fc 0%, #eef3f8 100%);
            color: var(--text);
        }

        .layout {
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #6d28d9, #4c1d95);
            color: #fff;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
            box-shadow: 10px 0 30px rgba(2, 6, 23, 0.2);
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 8px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 4px;
        }

        .logo-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-shadow: none;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand-text h2 {
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1.1;
        }

        .brand-text p {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.65);
            margin-top: 2px;
        }

        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link,
        .submenu a,
        .logout-link {
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            transition: 0.25s ease;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .nav-link i,
        .submenu a i,
        .logout-link i {
            width: 18px;
            text-align: center;
            opacity: 0.95;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.15);
        }

        .submenu a:hover,
        .logout-link:hover {
            background: rgba(255,255,255,0.08);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #f59e0b, #8b5cf6);
            color: white;
        }

        .nav-link .arrow {
            margin-left: auto;
            font-size: 0.8rem;
            opacity: 0.7;
            transition: transform 0.25s ease;
        }

        .nav-link.expanded .arrow {
            transform: rotate(90deg);
        }

        .submenu {
            display: none;
            flex-direction: column;
            gap: 6px;
            padding-left: 8px;
            margin-top: -2px;
        }

        .submenu.show {
            display: flex;
        }

        .submenu a {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.88);
            padding-left: 16px;
        }

        .logout-link {
            margin-top: auto;
            background: rgba(255,255,255,0.04);
        }

        .main-content {
            margin-left: 260px;
            padding: 24px;
            min-height: 100vh;
        }

        .mobile-menu-btn {
            display: none;
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 14px;
            background: var(--primary);
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(109, 93, 252, 0.25);
            margin-bottom: 16px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .page-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 10px 14px;
            font-size: 0.9rem;
            color: var(--muted);
            box-shadow: var(--shadow-soft);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            position: relative;
        }

        .notification-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            flex: 0 0 auto;
            flex-shrink: 0;
            z-index: 10;
        }

        .notification-bell {
            position: relative;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: white;
            border: 1px solid #e7ecf3;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
            cursor: pointer;
            padding: 0;
        }

        .notification-bell i {
            font-size: 1rem;
            color: #4b5563;
        }

        .notification-count {
            position: absolute;
            top: -6px;
            right: -6px;
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification-panel {
            display: none;
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 340px;
            max-height: 420px;
            overflow-y: auto;
            background: white;
            border: 1px solid #e7ecf3;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
            padding: 14px;
            z-index: 2000;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .notification-header h4 {
            font-size: 1rem;
            font-weight: 800;
            color: #111827;
        }

        .notification-header span {
            font-size: 0.82rem;
            color: #6b7280;
        }

        .notification-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification-empty {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .btn {
            border: none;
            border-radius: 14px;
            padding: 11px 16px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.22s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #8b5cf6);
            color: white;
        }

        .btn-dark {
            background: #111827;
            color: white;
            box-shadow: 0 10px 24px rgba(17, 24, 39, 0.16);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffb347, #ff8c42);
            color: white;
            box-shadow: 0 10px 24px rgba(255, 159, 67, 0.22);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .hero-card {
            background: linear-gradient(135deg, #f59e0b 0%, #8b5cf6 100%);
            color: white;
            border-radius: 24px;
            padding: 26px;
            box-shadow: 0 18px 40px rgba(79, 70, 229, 0.24);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .hero-text h1 {
            font-size: 1.65rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .hero-text p {
            color: rgba(255,255,255,0.88);
            max-width: 620px;
            line-height: 1.5;
        }

        .hero-badge {
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 22px;
        }

.stat-card {
    border-radius: 22px;
    padding: 20px;
    color: white;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.10);
    position: relative;
    overflow: hidden;
    border: none;
}

.stat-card::after {
    content: "";
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    right: -20px;
    top: -20px;
}

.stat-action-card {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
    transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
}

.stat-action-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 30px rgba(15, 23, 42, 0.14);
    filter: brightness(1.02);
}

.stat-action-card:active {
    transform: translateY(-1px);
}

.stat-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
}

.stat-card .label {
    font-size: 0.95rem;
    font-weight: 600;
    opacity: 0.95;
    margin-bottom: 0;
}

.stat-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: rgba(255,255,255,0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
}

.stat-card .value {
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 8px;
    line-height: 1;
    position: relative;
    z-index: 1;
}

.stat-card .subtext {
    font-size: 0.86rem;
    opacity: 0.88;
    position: relative;
    z-index: 1;
}
.stat-action-card.active {
    outline: 2px solid rgba(255,255,255,0.6);
    outline-offset: -2px;
    box-shadow: 0 18px 35px rgba(15, 23, 42, 0.18);
}
        .stat-purple { background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%); }
        .stat-orange { background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%); }
        .stat-green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 20px;
            box-shadow: var(--shadow-soft);
            margin-bottom: 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .toolbar-left,
        .toolbar-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .field,
        .select {
            background: white;
            border: 1px solid #dbe3ee;
            border-radius: 14px;
            padding: 12px 14px;
            outline: none;
            min-height: 46px;
            transition: 0.2s ease;
            color: var(--text);
        }

        .field {
            min-width: 250px;
            flex: 1;
        }

        .select {
            min-width: 150px;
        }

        .field:focus,
        .select:focus,
        textarea:focus,
        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 18px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 4px;
        }

        th {
            background: #f8fafc;
            color: #475569;
            text-align: left;
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.94rem;
            font-weight: 700;
            white-space: nowrap;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #eef2f7;
            color: #334155;
            background: #fff;
            vertical-align: top;
        }

        tr:hover td {
            background: #fafbff;
        }

        .status-badge {
            padding: 6px 10px;
            border-radius: 999px;
            color: white;
            font-size: 0.78rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-badge.pending {
            background: linear-gradient(135deg, #f59e0b, #f97316);
        }

        .status-badge.resolved,
        .status-badge.contacted {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .action-btn {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            font-size: 0.95rem;
            margin-right: 6px;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            transition: 0.2s ease;
            color: #374151;
        }

        .action-btn:hover {
            background: #ede9fe;
            border-color: #ddd6fe;
            color: #4f46e5;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 9px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
        }

        .page-info {
            font-size: 0.92rem;
            color: var(--muted);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .section-muted {
            color: var(--muted);
            font-size: 0.94rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.48);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 16px;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            position: relative;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.16);
        }

        .modal-content h3 {
            margin-bottom: 16px;
            font-size: 1.15rem;
            font-weight: 800;
        }

        .modal-content textarea,
        .modal-content input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid #dbe2ea;
            margin-bottom: 14px;
            resize: none;
            outline: none;
        }

        .modal-content textarea {
            min-height: 120px;
        }

        .modal-content button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 1.15rem;
            cursor: pointer;
            color: var(--muted);
        }
        @keyframes bellShake {
    0% { transform: rotate(0deg); }
    20% { transform: rotate(12deg); }
    40% { transform: rotate(-10deg); }
    60% { transform: rotate(8deg); }
    80% { transform: rotate(-6deg); }
    100% { transform: rotate(0deg); }
}

@keyframes bellGlow {
    0% { box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06); }
    50% { box-shadow: 0 10px 28px rgba(245, 158, 11, 0.28); }
    100% { box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06); }
}

.notification-bell.ringing {
    animation: bellShake 0.7s ease-in-out 3, bellGlow 1.2s ease-in-out 2;
}

            .stats-cards {
                grid-template-columns: 1fr 1fr;
            }
        }

    <style>
        :root {
            --bg: #f4f7f6;
            --panel: #ffffff;
            --border: #e2e9e6;
            --text: #24363b;
            --muted: #6a7b7b;
            --primary: #287c70;
            --primary-dark: #1e665c;
            --shadow: 0 10px 26px rgba(24, 45, 49, 0.06);
            --shadow-soft: 0 5px 16px rgba(24, 45, 49, 0.05);
        }
        body { background: #f4f7f6; color: #24363b; }
        .sidebar { background: #193239; box-shadow: 6px 0 20px rgba(22, 43, 48, 0.12); }
        .brand { border-bottom-color: rgba(255,255,255,.12); }
        .nav-link, .submenu a, .logout-link { border-radius: 10px; }
        .nav-link.active { background: rgba(77, 168, 150, .2); color: #fff; box-shadow: inset 3px 0 #69c4ae; }
        .nav-link:hover, .submenu a:hover, .logout-link:hover { background: rgba(255,255,255,.09); }
        .main-content { max-width: 1600px; }
        .page-chip { background: #e8f2ef; color: #287c70; border: 1px solid #d6e8e2; }
        .hero-card { background: #fff; color: #24363b; border: 1px solid #e2e9e6; box-shadow: var(--shadow-soft); }
        .hero-text p, .hero-badge { color: #6a7b7b; }
        .hero-badge { background: #e8f2ef; border-color: #d6e8e2; }
        .btn-primary, .modal-content button { background: #287c70; }
        .btn-warning { background: #f2a23a; }
        .panel, .stat-card { border-radius: 14px; box-shadow: var(--shadow-soft); }
        .stat-purple, .stat-orange, .stat-green { background: #fff; color: #24363b; border: 1px solid #e2e9e6; }
        .stat-card .label, .stat-card .subtext { color: #6a7b7b; }

<script src="api-config.js"></script>

<script>
const adminToken = localStorage.getItem("adminToken");

if (!adminToken) {
    alert("Please login again");
    window.location.href = "admin-login.html";
}

let messagesData = [];
let currentPage = 1;
const rowsPerPage = 5;
let currentReplyEmail = "";
let currentMessageId = "";
let currentSchoolEmail = "";
let currentSchoolId = "";
let notificationsSeen = localStorage.getItem("notificationsSeen") === "true";
function setActiveTab(element) {
    document.querySelectorAll(".nav-link").forEach(link => link.classList.remove("active"));
    element.classList.add("active");
}

function toggleSidebar() {
    const sidebar = document.querySelector(".sidebar");
    const overlay = document.getElementById("mobileOverlay");

    sidebar.classList.toggle("active");
    overlay.classList.toggle("active");
    document.body.classList.toggle("sidebar-open");
}
function closeSidebarOnMobile() {
    if (window.innerWidth <= 768) {
        closeSidebar();
    }
}
function closeSidebar() {
    const sidebar = document.querySelector(".sidebar");
    const overlay = document.getElementById("mobileOverlay");

    sidebar.classList.remove("active");
    overlay.classList.remove("active");
    document.body.classList.remove("sidebar-open");
}
function toggleApplicationsMenu() {
    const menu = document.getElementById("applicationsMenu");
    const toggle = document.getElementById("applicationsToggle");
    menu.classList.toggle("show");
    toggle.classList.toggle("expanded");
}

// function attachNavAutoClose() {
//     document.querySelectorAll(".nav-link").forEach(link => {
//         link.addEventListener("click", () => {
//             if (window.innerWidth <= 768) {
//                 closeSidebar();
//             }
//         });
//     });
// }
        
function attachDashboardEvents() {
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    const prevPage = document.getElementById("prevPage");
    const nextPage = document.getElementById("nextPage");
    const exportBtn = document.getElementById("exportBtn");

    if (searchInput) {
        searchInput.addEventListener("input", () => {
            currentPage = 1;
            renderTable();
        });
    }

    if (statusFilter) {
        statusFilter.addEventListener("change", () => {
            currentPage = 1;
            renderTable();
        });
    }

    if (prevPage) {
        prevPage.addEventListener("click", () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        });
    }

    if (nextPage) {
        nextPage.addEventListener("click", () => {
            const query = document.getElementById("searchInput")?.value.toLowerCase() || "";
            const filterValue = document.getElementById("statusFilter")?.value || "";
            const filtered = messagesData.filter(msg =>
                (msg.name.toLowerCase().includes(query) || msg.email.toLowerCase().includes(query)) &&
                (filterValue === "" || msg.status === filterValue)
            );
            const totalPages = Math.ceil(filtered.length / rowsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        });
    }

    if (exportBtn) {
        exportBtn.addEventListener("click", () => {
            const rows = [["Name", "Email", "Subject", "Message", "Status"]];
            messagesData.forEach(msg => rows.push([msg.name, msg.email, msg.subject, msg.message, msg.status]));
            const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "padhaan_messages.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    }
}

async function loadMessages() {
    const tbody = document.getElementById("messageList");
    if (!tbody) return;

    tbody.innerHTML = "<tr><td colspan='6'>Loading messages...</td></tr>";

    try {
        const response = await fetch("/admin/messages", {
            headers: {
                "Authorization": `Bearer ${adminToken}`
            }
        });

        const data = await response.json();

        if (!response.ok) {
            tbody.innerHTML = `<tr><td colspan='6' style='color:red;'>${data.error || "Error fetching data!"}</td></tr>`;
            return;
        }

        messagesData = data.map(msg => ({ ...msg, status: msg.status || "Pending" }));
        notificationsSeen = false;
localStorage.setItem("notificationsSeen", "false");
        updateContactStats();
        renderTable();
        updateStats();
        updateNotificationBadge();
    } catch (err) {
        tbody.innerHTML = "<tr><td colspan='6' style='color:red;'>Error fetching data!</td></tr>";
        console.log(err);
    }
}

async function loadDashboardData() {
    try {
        const contactRes = await fetch("/admin/messages", {
            headers: { Authorization: "Bearer " + adminToken }
        });
        const contacts = await contactRes.json();

        const schoolRes = await fetch("/admin/school-partners", {
            headers: { Authorization: "Bearer " + adminToken }
        });
        const schools = await schoolRes.json();

        messagesData = Array.isArray(contacts) ? contacts.map(msg => ({ ...msg, status: msg.status || "Pending" })) : [];
        window.schoolRequestsData = Array.isArray(schools) ? schools : [];

        const totalContactsEl = document.getElementById("totalContacts");
        const pendingContactsEl = document.getElementById("pendingContacts");
        const resolvedContactsEl = document.getElementById("resolvedContacts");
        const totalSchoolsEl = document.getElementById("totalSchools");

        if (totalContactsEl) totalContactsEl.innerText = messagesData.length;
        if (pendingContactsEl) pendingContactsEl.innerText = messagesData.filter(c => c.status === "Pending").length;
        if (resolvedContactsEl) resolvedContactsEl.innerText = messagesData.filter(c => c.status === "Resolved").length;
        if (totalSchoolsEl) totalSchoolsEl.innerText = window.schoolRequestsData.length;

        updateNotificationBadge();
        renderDashboardCharts();
    } catch (err) {
        console.log(err);
    }
}

async function updateNotificationBadge() {
    try {
        const contactRes = await fetch("/admin/messages", {
            headers: { Authorization: "Bearer " + adminToken }
        });
        const contacts = await contactRes.json();

        const schoolRes = await fetch("/admin/school-partners", {
            headers: { Authorization: "Bearer " + adminToken }
        });
        const schools = await schoolRes.json();

        const pendingContacts = Array.isArray(contacts)
            ? contacts.filter(c => c.status === "Pending").length
            : 0;

        const pendingSchools = Array.isArray(schools)
            ? schools.filter(s => (s.status || "Pending") === "Pending").length
            : 0;

        const totalPending = pendingContacts + pendingSchools;

        const badge = document.getElementById("notificationCount");
        if (!badge) return;

        if (totalPending <= 0) {
            badge.style.display = "none";
            badge.innerText = "0";
            return;
        }

        if (notificationsSeen) {
            badge.style.display = "none";
        } else {
            badge.innerText = totalPending;
            badge.style.display = "flex";
        }
    } catch (err) {
        console.log("Notification badge error:", err);
    }
}
function animateNotificationBell() {
    const bell = document.getElementById("notificationBell");
    const badge = document.getElementById("notificationCount");

    if (!bell || !badge) return;

    const count = parseInt(badge.innerText || "0", 10);

    if (count > 0) {
        bell.classList.remove("ringing");
        void bell.offsetWidth; // restart animation
        bell.classList.add("ringing");

        setTimeout(() => {
            bell.classList.remove("ringing");
        }, 2500);
    }
}
function toggleNotificationPanel() {
    const panel = document.getElementById("notificationPanel");
    if (!panel) return;

    const isVisible = panel.style.display === "block";
    panel.style.display = isVisible ? "none" : "block";

    if (!isVisible) {
        notificationsSeen = true;
        localStorage.setItem("notificationsSeen", "true");
        updateNotificationBadge();
        loadNotifications();
    }
}

async function loadNotifications() {
    const list = document.getElementById("notificationList");
    if (!list) return;

    list.innerHTML = `<div class="notification-empty">Loading...</div>`;

    try {
        const contactRes = await fetch("/admin/messages", {
            headers: { Authorization: "Bearer " + adminToken }
        });
        const contacts = await contactRes.json();

        const schoolRes = await fetch("/admin/school-partners", {
            headers: { Authorization: "Bearer " + adminToken }
        });
        const schools = await schoolRes.json();

        const pendingContacts = Array.isArray(contacts)
            ? contacts.filter(c => c.status === "Pending").slice(-5).reverse()
            : [];

        const pendingSchools = Array.isArray(schools)
            ? schools.filter(s => (s.status || "Pending") === "Pending").slice(-5).reverse()
            : [];

        let html = "";

        pendingContacts.forEach(item => {
    html += `
        <div onclick="openNotificationTarget('contact')" style="padding:12px; border:1px solid #eef2f7; border-radius:14px; background:#fafbff; cursor:pointer;">
            <div style="font-size:0.8rem; font-weight:700; color:#8b5cf6; margin-bottom:4px;">Contact Message</div>
            <div style="font-size:0.92rem; font-weight:600; color:#111827;">${item.name || "Unknown"}</div>
            <div style="font-size:0.85rem; color:#6b7280;">${item.subject || "No subject"}</div>
        </div>
    `;
});
        pendingSchools.forEach(item => {
    html += `
        <div onclick="openNotificationTarget('school')" style="padding:12px; border:1px solid #eef2f7; border-radius:14px; background:#fffaf5; cursor:pointer;">
            <div style="font-size:0.8rem; font-weight:700; color:#f59e0b; margin-bottom:4px;">School Request</div>
            <div style="font-size:0.92rem; font-weight:600; color:#111827;">${item.schoolName || "Unknown School"}</div>
            <div style="font-size:0.85rem; color:#6b7280;">${item.contactName || "No contact name"} • ${item.city || "No city"}</div>
        </div>
    `;
});

        if (!html) {
            html = `<div class="notification-empty">No pending notifications</div>`;
        }

        list.innerHTML = html;
    } catch (err) {
        console.log(err);
        list.innerHTML = `<div class="notification-empty" style="color:#ef4444;">Failed to load notifications</div>`;
    }
}
function openNotificationTarget(type) {
    const panel = document.getElementById("notificationPanel");
    if (panel) panel.style.display = "none";

    notificationsSeen = true;
    localStorage.setItem("notificationsSeen", "true");
    updateNotificationBadge();

    if (type === "contact") {
        showContactPanel();
    } else if (type === "school") {
        showSchoolPartnersPanel();
    }
}

function renderDashboardCharts() {
    const contactCanvas = document.getElementById("contactChart");
    const schoolCanvas = document.getElementById("schoolChart");

    if (!contactCanvas || !schoolCanvas) return;

    const contactMonthly = getMonthlyData(messagesData);
    const schoolMonthly = getMonthlyData(window.schoolRequestsData || []);

    if (window.contactChartInstance) {
        window.contactChartInstance.destroy();
    }

    if (window.schoolChartInstance) {
        window.schoolChartInstance.destroy();
    }

    window.contactChartInstance = new Chart(contactCanvas, {
        type: "line",
        data: {
            labels: contactMonthly.labels,
            datasets: [{
                label: "Contact Messages",
                data: contactMonthly.data,
                fill: false,
                tension: 0.4
            }]
        },
        options: {
            responsive: true
        }
    });

    window.schoolChartInstance = new Chart(schoolCanvas, {
        type: "line",
        data: {
            labels: schoolMonthly.labels,
            datasets: [{
                label: "School Requests",
                data: schoolMonthly.data,
                fill: false,
                tension: 0.4
            }]
        },
        options: {
            responsive: true
        }
    });
}

function renderTable() {
    const tbody = document.getElementById("messageList");
    if (!tbody) return;

    const searchInput = document.getElementById("searchInput");
    const statusFilterEl = document.getElementById("statusFilter");

    const query = searchInput ? searchInput.value.toLowerCase() : "";
    const statusFilter = statusFilterEl ? statusFilterEl.value : "";

    const filtered = messagesData.filter(msg =>
        (msg.name.toLowerCase().includes(query) || msg.email.toLowerCase().includes(query)) &&
        (statusFilter === "" || msg.status === statusFilter)
    );

    const totalPages = Math.ceil(filtered.length / rowsPerPage);
    if (currentPage > totalPages) currentPage = totalPages || 1;

    const start = (currentPage - 1) * rowsPerPage;
    const pageData = filtered.slice(start, start + rowsPerPage);

    if (pageData.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6'>No messages found.</td></tr>";
    } else {
        tbody.innerHTML = pageData.map(msg => `
            <tr>
                <td><strong>${msg.name}</strong></td>
                <td>${msg.email}</td>
                <td>${msg.subject}</td>
                <td>${msg.message}</td>
                <td><span class="status-badge ${msg.status.toLowerCase()}">${msg.status}</span></td>
                <td>
                    <button class="action-btn" title="Reply" onclick="openReplyModal('${msg.email}', '${msg._id}')">
                        <i class="fas fa-reply-all"></i>
                    </button>
                    <button class="action-btn" title="Delete" onclick="deleteMessage('${msg._id}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join("");
    }

    const pageInfo = document.getElementById("pageInfo");
    if (pageInfo) {
        pageInfo.innerText = `Page ${currentPage} of ${totalPages || 1}`;
    }
}

function updateStats() {
    const statCards = document.querySelectorAll(".stat-card");
    if (statCards.length < 3) return;

    statCards[0].querySelector(".value").innerText = `${messagesData.length}`;
    statCards[1].querySelector(".value").innerText = `${messagesData.filter(m => m.status === "Pending").length}`;
    statCards[2].querySelector(".value").innerText = `${messagesData.filter(m => m.status === "Resolved").length}`;
}

function updateContactStats() {
    const totalEl = document.getElementById("contactTotalCount");
    const pendingEl = document.getElementById("contactPendingCount");
    const resolvedEl = document.getElementById("contactResolvedCount");

    if (!totalEl || !pendingEl || !resolvedEl) return;

    totalEl.innerText = messagesData.length;
    pendingEl.innerText = messagesData.filter(m => m.status === "Pending").length;
    resolvedEl.innerText = messagesData.filter(m => m.status === "Resolved").length;
}

function openReplyModal(email, id) {
    currentReplyEmail = email;
    currentMessageId = id;
    document.getElementById("replyEmail").innerText = email;
    document.getElementById("replyMessage").value = "";
    document.getElementById("replyModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("replyModal").style.display = "none";
}

async function sendReply() {
    const msg = document.getElementById("replyMessage").value.trim();

    if (!msg) {
        alert("Please type a message.");
        return;
    }

    try {
        const res = await fetch("/admin/reply", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${adminToken}`
            },
            body: JSON.stringify({
                to: currentReplyEmail,
                subject: "Reply from Padhaan",
                message: msg,
                id: currentMessageId
            })
        });

        const data = await res.json();

        if (res.ok) {
            alert(`Reply sent to ${currentReplyEmail}`);
            closeModal();

            messagesData = messagesData.map(m =>
                m._id === currentMessageId ? { ...m, status: "Resolved" } : m
            );

            renderTable();
            updateStats();
            updateContactStats();
            updateNotificationBadge();
        } else {
            alert("Failed: " + (data.error || "Unknown error"));
        }
    } catch (err) {
        alert("Error sending reply.");
        console.log(err);
    }
}

async function deleteMessage(id) {
    if (confirm("Are you sure you want to delete this message?")) {
        try {
            const res = await fetch(`/admin/messages/${id}`, {
                method: "DELETE",
                headers: {
                    "Authorization": `Bearer ${adminToken}`
                }
            });

            if (res.ok) {
                messagesData = messagesData.filter(m => m._id !== id);
                renderTable();
                updateStats();
                updateContactStats();
                updateNotificationBadge();
                alert("Message deleted.");
            } else {
                alert("Failed to delete message.");
            }
        } catch (err) {
            alert("Error deleting message.");
        }
    }
}

                    <input type="text" id="searchInput" class="field" placeholder="Search by School or Email">
                </div>

                <div class="toolbar-right">
                    <button id="exportBtn" class="btn btn-dark">Export CSV</button>

                <table>
                    <thead>
                        <tr>
                            <th>School</th>
                            <th>Contact</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>City</th>
                            <th>Status</th>
                            <th>Preferred Contact Time</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="partnerList"></tbody>
                </table>
            </div>
        </section>
    `;

    try {
        const res = await fetch("/admin/school-partners", {
            headers: {
                "Authorization": "Bearer " + adminToken
            }
        });

        const data = await res.json();
        const tbody = document.getElementById("partnerList");

        if (!res.ok) {
            tbody.innerHTML = `<tr><td colspan="8" style="color:red;">${data.error}</td></tr>`;
            return;
        }

        window.schoolRequestsData = data;
        notificationsSeen = false;
localStorage.setItem("notificationsSeen", "false");
        updateSchoolStats(data);
        updateNotificationBadge();

        if (!data.length) {
            tbody.innerHTML = `<tr><td colspan="8">No data found</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(item => `
            <tr>
                <td><strong>${item.schoolName || ""}</strong></td>
                <td>${item.contactName || ""}</td>
                <td>${item.contactEmail || ""}</td>
                <td>${item.contactPhone || ""}</td>
                <td>${item.city || ""}</td>
                <td>
                    <select onchange="updateSchoolStatus('${item._id}', this.value)" class="select" style="min-width:130px; padding:8px 10px; min-height:auto;">
                        <option value="Pending" ${item.status === "Pending" ? "selected" : ""}>Pending</option>
                        <option value="Contacted" ${item.status === "Contacted" ? "selected" : ""}>Contacted</option>
                    </select>
                </td>
                <td>${item.preferredTime || "Not specified"}</td>
                <td>
                    <button class="action-btn" title="Reply" onclick="openSchoolReplyModal('${item.contactEmail}', '${item._id}')">
                        <i class="fas fa-reply"></i>
                    </button>
                    <button class="action-btn" title="Delete" onclick="deleteSchool('${item._id}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join("");

        document.getElementById("searchInput").addEventListener("input", function () {
            const query = this.value.toLowerCase();
            const rows = document.querySelectorAll("#partnerList tr");

            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(query) ? "" : "none";
            });
        });

        document.getElementById("exportBtn").addEventListener("click", () => {
            const rows = [["School", "Contact", "Email", "Phone", "City", "Status", "Preferred Contact Time"]];
            data.forEach(d => rows.push([
                d.schoolName || "",
                d.contactName || "",
                d.contactEmail || "",
                d.contactPhone || "",
                d.city || "",
                d.status || "Pending",
                d.preferredTime || ""
            ]));

            const csv = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csv));
            link.setAttribute("download", "school_partners.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

    } catch (err) {
        console.log(err);
        document.getElementById("partnerList").innerHTML = `
            <tr><td colspan="8" style="color:red;">Server error</td></tr>
        `;
    }
}

            alert(data.error || "Failed to update status");

            updateNotificationBadge();
            showSchoolPartnersPanel();
        }
    } catch (err) {
        console.log(err);
        alert("Server error while updating status");
    }
}
function getMonthlyData(data, field = "createdAt") {
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const counts = new Array(12).fill(0);

    data.forEach(item => {
        if (!item[field]) return;
        const date = new Date(item[field]);
        const month = date.getMonth();
        counts[month]++;
    });

    return { labels: months, data: counts };
}
function updateSchoolStats(data) {
    const totalEl = document.getElementById("schoolTotalCount");
    const pendingEl = document.getElementById("schoolPendingCount");
    const contactedEl = document.getElementById("schoolContactedCount");
    const preferredEl = document.getElementById("schoolPreferredTimeCount");

    if (!totalEl || !pendingEl || !contactedEl || !preferredEl) return;

    totalEl.innerText = data.length;
    pendingEl.innerText = data.filter(d => (d.status || "Pending") === "Pending").length;
    contactedEl.innerText = data.filter(d => d.status === "Contacted").length;
    preferredEl.innerText = data.filter(d => d.preferredTime && d.preferredTime.trim() !== "").length;
}

        return;

    try {
        const res = await fetch("/admin/reply", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + adminToken
            },
            body: JSON.stringify({
                to: currentSchoolEmail,
                subject: "Padhaan Partnership Response",
                message: message,
                id: currentSchoolId
            })
        });

        const data = await res.json();

        if (res.ok) {
            await fetch("/admin/school-partners/" + currentSchoolId + "/status", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + adminToken
                },

            });

            alert("Reply sent successfully");
            closeSchoolReplyModal();
            updateNotificationBadge();
            showSchoolPartnersPanel();
        } else {
            alert(data.error || "Failed to send email");

    } catch (err) {
        console.log(err);
        alert("Server error");
    }
}

async function changePassword() {
    const oldPassword = document.getElementById("oldPassword").value;

    if (!oldPassword || !newPassword) {
        alert("Please fill both fields");
        return;
    }

    try {
        const res = await fetch("/admin/change-password", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${adminToken}`
            },
            body: JSON.stringify({ oldPassword, newPassword })
        });

        const data = await res.json();

        if (res.ok) {
            alert("Password updated successfully");
            closeChangePasswordModal();
            document.getElementById("oldPassword").value = "";
            document.getElementById("newPassword").value = "";
        } else {
            alert(data.error || "Error updating password");
        }
    } catch (err) {
        console.log(err);
        alert("Server error");
    }
}

window.onclick = function(event) {
    const replyModal = document.getElementById("replyModal");
    const passwordModal = document.getElementById("changePasswordModal");
    const schoolReplyModal = document.getElementById("schoolReplyModal");
    const notificationPanel = document.getElementById("notificationPanel");
    const notificationBell = document.getElementById("notificationBell");

    if (event.target === replyModal) {
        closeModal();
    }

    if (event.target === passwordModal) {
        closeChangePasswordModal();
    }

    if (event.target === schoolReplyModal) {
        closeSchoolReplyModal();
    }

    if (
        notificationPanel &&
        notificationBell &&
        !notificationPanel.contains(event.target) &&
        !notificationBell.contains(event.target)
    ) {
        notificationPanel.style.display = "none";
    }
};
